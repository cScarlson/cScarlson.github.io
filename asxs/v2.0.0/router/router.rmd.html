
<body>
    <template>
        <as-routelet></as-routelet>
    </template>
    <style>
        as-router {
            display: block;
            
            as-routelet {
                display: block;
            }
            
        }
    </style>
    <script type="module">
        import { CustomElement } from '/asxs/v2.0.0/core/element/element.js';
        import { customElement } from '/asxs/v2.0.0/core/element/custom.js';
        
        const { log } = console;
        const { top } = window;
        const pattern_param = /\{\w+\}/i;
        
        customElement('as-router')
        (class MagazineJSRouterElement extends CustomElement {
            state = { initial: true };
            get #outlet() { return this.querySelector('as-routelet') }
            get #routes() { return this.querySelector('template') }
            get #content() { return this.#routes.content }
            get #children() { return this.#content.children }
            get #_404() { return this.#content.querySelector('.404') }
            
            #reveal({ id, data }) {
                const keys = Object.keys(data);
                const dataset = keys.map( key => ({ key, value: data[key] }) );
                const node = this.#content.querySelector(`[id="${id}"]`);
                const clone = node.cloneNode(true);
                
                for (const { key, value } of dataset) clone.setAttribute(`data-${key}`, value);
                this.#outlet.innerHTML = clone.outerHTML;
            }
            
            #match(segments, paths, ...more) {
                if (!paths) return { found: false };
                if (paths.length !== segments.length) return this.#match(segments, ...more);
                const id = paths.join('/');
                const values = segments.reduce(determine, []);
                const data = values.reduce(get, {});
                
                function determine(matches, segment, i) {
                    const { [i]: value } = paths;
                    const paremeter = pattern_param.test(value);
                    const match = value.substring(1, value.length - 1);
                    
                    if (value === '*') return [ ...matches, `${i}:${segment}` ];
                    if (paremeter) return [ ...matches, `${match}:${segment}` ];
                    if (value === segment) return [ ...matches, segment ];  // exact match
                    return matches;
                }
                
                function get(data, segment) {
                    const [key, val] = segment.split(':');
                    if (!key) return data;
                    if (!val) return data;
                    return { ...data, [key]: val };
                }
                
                if (!values.length) return this.#match(segments, ...more);
                if (values.length !== segments.length) return this.#match(segments, ...more);
                return { id, data, values, found: true };
            }
            
            #handlePopstate = setTimeout.bind(window, (e) => {
                const { top } = window;
                const { location } = top;
                const { pathname } = location;
                const segments = pathname.split('/');
                const paths = [ ...this.#children ].map( element => element.id.split('/') );
                const match = this.#match(segments, ...paths);
                
                if (!match.found) return;
                this.state = match;
                this.#reveal(match);
            }, 0);
            
            handleEvent(e) {
                if (e.type === 'popstate') return this.#handlePopstate(e);
            }
            
            stabilize() {
                this.idle();
            }
            
            createRenderRoot() {
                return this;
            }
            
            initialize() {
                const { top } = window;
                const { location } = top;
                const { searchParams } = new URL(location);
                const has = searchParams.has('redirect');
                const redirect = searchParams.get('redirect');
                const decoded = decodeURIComponent(redirect);
                
                if (has) return this.#redirect(decoded);
                this.#handlePopstate({ type: 'initial' });
            }
            
            #redirect(redirect) {
                const { top } = window;
                const { history } = top;
                
                log(`@REDIRECTED TO POPSTATE`, redirect);
                history.replaceState({ redirect }, '', redirect);
                this.#handlePopstate({ type: 'initial' });
            }
            
            connectedCallback( x = super.connectedCallback() ) {
                this.initialize();
                top.addEventListener('popstate', this, false);
            }
            
            disonnectedCallback( x = super.disconnectedCallback() ) {
                top.removeEventListener('popstate', this, false);
            }
            
        });
    </script>
</body>
