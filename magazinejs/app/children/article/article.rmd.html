
<body>
    <template>
        <template>
            <iframe src="./app/children/article/children/articles/articles.rmd.html" is="as-frameless"></iframe>
            <iframe src="./app/children/article/children/article/article.rmd.html" is="as-frameless" type="type" query="${query}"></iframe>
        </template>
    </template>
    <template class="result">
        <mag-page-article></mag-page-article>
    </template>
    <style></style>
    <script type="module">
        import { CustomElement } from '/asxs/v2.0.0/core/element/element.js';
        import { customElement } from '/asxs/v2.0.0/core/element/custom.js';
        import { publishers, articles, published, tags } from '/magazinejs/app/core/data/data.js';
        
        const { parent } = window;
        const { location } = parent;
        const { searchParams } = new URL(location);
        const { content } = document.querySelector('template.result');
        const type = searchParams.get('type');
        const query = searchParams.get('q');
        
        customElement('mag-page-article')
        (class MagazineJSRouterElement extends CustomElement {
            type = type;
            query = query;
            
            stabilize() {
                this.idle();
            }
            
            createRenderRoot() {
                return this;
            }
            
            connectedCallback( x = super.connectedCallback() ) {
                const { content: { children: [ articles, article ] } } = this.querySelector('template');
                const target = type ? article : articles;
                const clone = target.cloneNode(true);
                
                this.appendChild(clone);
            }
            
        });
        
        console.log(`@ARTICLE.URL`, type, query);
        frameElement.after(content);
    </script>
</body>
