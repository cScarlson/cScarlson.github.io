
<body>
    <template>
        <section class="magazinejs view article">
            <header class="view header">
                <h1 class="header title filtered" data-type="${type}" data-query="${query}">
                    Articles by <span class="title type">${type}</span>: 
                    "<span class="title query">${query}</span>"
                </h1>
                <h1 class="header title unfiltered" data-type="${type}" data-query="${query}">All Articles</h1>
                <h2 class="header subtitle">Viewing ${articles.length} article(s)</h2>
            </header>
            <div class="view body">
                <ul class="body article collection">
                    <li class="article item" +for="let article of articles">
                        <iframe src="/magazinejs/app/children/article/card.rmd.html" is="as-frameless" article="${article.id}"></iframe>
                    </li>
                </ul>
            </div>
            <footer class="view footer"></footer>
        </section>
    </template>
    <template class="result">
        <mag-article-collection></mag-article-collection>
    </template>
    <style>
        mag-article-collection {
            display: block;
            
            .magazinejs.view.article {
                
                .view.header {
                    
                    .header.title {
                        font-size: var(--font-size-3);
                        &:is([data-type="null"], [data-query="null"]) {
                            &.filtered {
                                display: none;
                            }
                            &.unfiltered {
                                display: block;
                            }
                        }
                        &.unfiltered {
                            display: none;
                        }
                        
                        .title.type {
                            text-transform: capitalize;
                        }
                        
                        .title.query {
                            color: var(--yellow-6);
                        }
                        
                    }
                    
                    .header.subtitle {
                        font-size: var(--font-size-1);
                    }
                    
                }
                
                .view.body {
                    
                    .body.article.collection {
                        padding: 0;
                        list-style-type: none;
                        
                        .article.item {
                            margin-block: var(--size-3);
                            
                            .item.action {}
                            
                        }
                        
                    }
                    
                }
                
                .view.footer {}
                
            }
            
        }
    </style>
    <script type="module">
        import { CustomElement } from '/asxs/v2.0.0/core/element/element.js';
        import { customElement } from '/asxs/v2.0.0/core/element/custom.js';
        import { TemplateCrawler } from '/asxs/v2.0.0/core/element/template.crawler.js';
        import { published, $publishers, $authors, $tags } from '/magazinejs/app/core/data/data.js';
        
        const { parent } = window;
        const { location } = parent;
        const { searchParams } = new URL(location);
        const { content } = document.querySelector('template.result');
        const type = `${ searchParams.get('type') }`;  // ensure is string
        const query = `${ searchParams.get('q') }`;  // ensure is string
        const { [type]: articles } = {
            '': published,
            'undefined': published,
            'null': published,
            'all': published,
            'publisher': $publishers.get(query),
            'author': $authors.get(query),
            'tag': $tags.get( query.toLowerCase() ),
        };
        
        customElement('mag-article-collection')
        (class MagazineJSRouterElement extends CustomElement {
            ['crawler:template'] = new TemplateCrawler(this);
            type = type;
            query = query;
            articles = articles;
            
            stabilize() {
                this.idle();
            }
            
            createRenderRoot() {
                return this;
            }
            
        });
        
        if (!articles) location.assign('/magazinejs/404');
        else frameElement.after(content);
    </script>
</body>
