
<body>
    <template>
        <div class="magazinejs view publishers">
            <header class="view header">
                <h1 class="view title">Publishers</h1>
            </header>
            <div class="view body">
                <ul class="body publisher list">
                    <li class="publisher item" +for="let publisher of publishers">
                        <div class="publisher card">
                            <a class="card name" href="./articles/?type=publisher&q=${publisher.name}" is="as-pushstate">${publisher.name}</a>
                            <span class="card authors">${ publisher.authors.join(', ') }</span>
                            <a class="card articles" href="./articles/?type=publisher&q=${publisher.name}" is="as-pushstate">Aricles Published: ${publisher.articles.length}</a>
                        </div>
                    </li>
                </ul>
            </div>
            <footer class="view footer"></footer>
        </div>
    </template>
    <style>
        mag-publisher-collection {
            display: block;
            
            .magazinejs.view.publishers {
                
                .view.header {}
                
                .view.body {
                    
                    .body.publisher.list {
                        padding: 0;
                        list-style-type: none;
                        
                        .publisher.item {
                            
                            .publisher.card {
                                box-shadow: var(--shadow-3);
                                border-radius: var(--radius-2);
                                padding: var(--size-px-3);
                                overflow: hidden;
                                
                                .card.name, .card.authors, .card.articles {
                                    display: block;
                                }
                                
                                .card.name {
                                    color: var(--yellow-6);
                                    text-decoration: none;
                                    font-size: var(--font-size-4);
                                    font-weight: var(--font-weight-6);
                                }
                                
                                .card.authors {
                                    font-size: var(--font-size-1);
                                }
                                
                                .card.articles {
                                    text-decoration: none;
                                    font-size: var(--font-size-2);
                                }
                                
                            }
                            
                        }
                        
                    }
                    
                }
                
                .view.footer {}
                
            }
            
        }
    </style>
    <script type="module">
        import { CustomElement } from '/asxs/v2.0.0/core/element/element.js';
        import { customElement } from '/asxs/v2.0.0/core/element/custom.js';
        import { TemplateCrawler } from '/asxs/v2.0.0/core/element/template.crawler.js';
        import { schemata } from '/magazinejs/app/core/data/data.js';
        import { Publisher } from './publisher.model.js';
        
        const TAGNAME = 'mag-publisher-collection';
        const content = document.createElement(TAGNAME);
        const publishers = schemata.map( p => new Publisher(p) );
        
        customElement(TAGNAME)
        (class MagazineJSArticleCollectionElement extends CustomElement {
            ['crawler:template'] = new TemplateCrawler(this);
            publishers = publishers;
            
            stabilize() {
                this.idle();
            }
            
            createRenderRoot() {
                return this;
            }
            
        });
        
        frameElement.after(content);
    </script>
</body>
