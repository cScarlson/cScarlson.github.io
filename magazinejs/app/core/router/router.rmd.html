
<body>
    <template>
        <rmd-outlet></rmd-outlet>
        <style>
            mag-router {
                border: solid 1px tomato;
                display: block;
                
                rmd-outlet {
                    display: block;
                }
                
            }
        </style>
    </template>
    <script type="module">
        import { utilities } from '/asxs/v2.0.0/core/utilities/utilities.js';
        import { Route, root } from '/magazinejs/app/routes.js';
        
        const { log } = console;
        const router = new (class Router {
            #root = root;
            #template = document.querySelector('template');
            #content = this.#template.content;
            #children = this.#content.children;
            #outlet = this.#children[0];
            
            constructor() {
                const { top } = window;
                const { location, history } = top;
                const { pathname } = new URL(location);
                
                history.replaceState({ initial: true }, '', pathname);
                Route.attach(this);
                setTimeout(x => this.#init(), 0);
            }
            
            async #init() {
                // frameElement.replaceWith(this.#content);
                frameElement.after(this.#outlet);
                frameElement.style.setProperty('display', 'none');
            }
            
            call(state) {
                if (state.initial) return;
                const { rmd } = state;
                const iframe = document.createElement('iframe', { is: 'as-frameless' });
                
                this.#outlet.innerHTML = '';
                iframe.setAttribute('is', 'as-frameless');
                iframe.src = rmd;
                setTimeout(x => this.#outlet.appendChild(iframe), 1_000 * 0);
            }
            
        })();
    </script>
</body>
