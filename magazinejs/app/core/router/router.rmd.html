
<body>
    <template></template>
    <style>
        mag-router {
            /* border: solid 1px tomato; */
            display: block;
        }
    </style>
    <script type="module">
        import { CustomElement } from '/asxs/v2.0.0/core/element/element.js';
        import { customElement } from '/asxs/v2.0.0/core/element/custom.js';
        import { publishers, articles, published, tags } from '/magazinejs/app/core/data/data.js';
        
        customElement('mag-router')
        (class MagazineJSRouterElement extends CustomElement {
            
            stabilize() {
                this.idle();
            }
            
            createRenderRoot() {
                return this;
            }
            
            #getRouteNode(content, pathname, child, ...more) {
                if (!child) return content.querySelector('*[path="**/404"]');
                const { attributes } = child;
                const { path: { value: path } } = attributes;
                const matches = this.#matches(path, pathname);
                
                if (matches) return child.cloneNode(true);
                return this.#getRouteNode(content, pathname, ...more);
            }
            
            #matches(path, pathname) {
                return (path === pathname);  // todo: sophisticate
            }
            
            #reveal(clone) {
                this.appendChild(clone);
            }
            
            connectedCallback( x = super.connectedCallback() ) {
                const { parent } = window;
                const { location } = parent;
                const { pathname } = location;
                const { content } = this.querySelector('template');
                const { children } = content;
                const clone = this.#getRouteNode(content, pathname, ...children);
                
                if (clone) this.#reveal(clone);
            }
            
        });
        
        console.log(`@ROUTER`);
    </script>
</body>
